version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pvapp
      POSTGRES_USER: pvapp
      POSTGRES_PASSWORD: pvapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvapp -d pvapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./pv-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://pvapp:pvapp@db:5432/pvapp
      NEXTAUTH_URL: http://localhost:3000
      # Demo-Secret – nur für lokalen Test geeignet
      NEXTAUTH_SECRET: demo-secret-lokal-bitte-aendern-fuer-produktion
      STORAGE_LOCAL_PATH: /app/storage
    volumes:
      - app_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  app_storage:
