<style>
/* Layout: Arbeitsblatt-Logik – feste Kopfleiste, Schrittleiste, darunter eine Spalte mit Karten; Raster als zentrales Werkstück */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #e4e9ef;
  --ink: #16212c;
  --ink-soft: #536273;
  --line: #cbd4de;
  --accent: #1f4fbf;      /* Modulblau */
  --accent-soft: #dfe8fb;
  --accent-ink: #ffffff;
  --mark: #e8a317;        /* Auswahl / Markierung */
  --ok: #17803d; --ok-soft: #dcf3e3;
  --warn: #9a6200; --warn-soft: #fbefd2;
  --err: #b42318; --err-soft: #fbe1de;
  --top: #14202b; --top-ink: #f2f5f8;
  --cell-empty: #ffffff; --cell-line: #aab7c5;
  --obst: #cfd5dc; --obst-2: #e3e7ec;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151c; --surface: #18212b; --surface-2: #222d39; --ink: #e6ecf2; --ink-soft: #9aa9b8; --line: #33414f;
  --accent: #6d97ff; --accent-soft: #1d2b4a; --accent-ink: #0b1220; --mark: #f0b53a;
  --ok: #5cc985; --ok-soft: #173325; --warn: #e8b54d; --warn-soft: #3a2e14; --err: #ff8a7a; --err-soft: #3d1c19;
  --top: #0a0f14; --top-ink: #e6ecf2; --cell-empty: #1c2631; --cell-line: #4a5a6b; --obst: #4a5561; --obst-2: #3a434d;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #18212b; --surface-2: #222d39; --ink: #e6ecf2; --ink-soft: #9aa9b8; --line: #33414f;
  --accent: #6d97ff; --accent-soft: #1d2b4a; --accent-ink: #0b1220; --mark: #f0b53a;
  --ok: #5cc985; --ok-soft: #173325; --warn: #e8b54d; --warn-soft: #3a2e14; --err: #ff8a7a; --err-soft: #3d1c19;
  --top: #0a0f14; --top-ink: #e6ecf2; --cell-empty: #1c2631; --cell-line: #4a5a6b; --obst: #4a5561; --obst-2: #3a434d;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--top); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1.02rem; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-soft); } .small { font-size: 0.85rem; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--top); color: var(--top-ink);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; letter-spacing: 0.02em; background: none; border: 0; color: inherit; cursor: pointer; padding: 4px 0; }
.brand small { font-family: var(--font-body); font-weight: 500; font-size: 0.72rem; opacity: 0.7; margin-left: 6px; letter-spacing: 0.06em; text-transform: uppercase; }
.top nav { display: flex; gap: 4px; }
.top nav button { background: none; border: 1px solid transparent; color: inherit; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.top nav button[aria-current="page"] { border-color: rgba(255,255,255,0.35); }
.top .spacer { flex: 1; }
.top label { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; opacity: 0.9; }
.top select { background: transparent; border: 1px solid rgba(255,255,255,0.35); color: inherit; border-radius: 6px; padding: 4px 6px; }
.top select option { color: #111; }
.savestate { font-size: 0.78rem; opacity: 0.8; min-width: 7em; text-align: right; }
.savestate.err { color: #ffb4a8; opacity: 1; font-weight: 600; }

.wrap { max-width: 1120px; margin: 0 auto; padding-block: 18px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.g2, .g3 { display: grid; gap: 12px 16px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .g2 { grid-template-columns: 1fr 1fr; } .g3 { grid-template-columns: repeat(3, 1fr); } }
.span { grid-column: 1 / -1; }

.field { display: grid; gap: 4px; font-size: 0.86rem; font-weight: 600; color: var(--ink-soft); min-width: 0; }
.field .req { color: var(--err); }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 10px 11px; min-height: 44px; width: 100%; color: var(--ink); }
textarea { min-height: 76px; resize: vertical; }
input:disabled, select:disabled, textarea:disabled { background: var(--surface-2); color: var(--ink-soft); }
input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; min-height: 0; accent-color: var(--accent); }
.check { display: inline-flex; gap: 8px; align-items: center; font-weight: 500; color: var(--ink); min-height: 40px; font-size: 0.95rem; }
.miss { border-color: var(--err); background: var(--err-soft); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--err); }
.btn.sm { min-height: 36px; padding: 5px 10px; font-size: 0.88rem; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; background: var(--surface-2); color: var(--ink-soft); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.err { background: var(--err-soft); color: var(--err); }
.pill.st-zur_pruefung { background: var(--accent-soft); color: var(--accent); }
.pill.st-abgeschlossen { background: var(--ok-soft); color: var(--ok); }
.pill.st-nacharbeit { background: var(--warn-soft); color: var(--warn); }
.note { padding: 10px 12px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); font-size: 0.9rem; }
.note.err { background: var(--err-soft); border-color: transparent; color: var(--err); }
.note.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.note.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.note.info { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

/* Projektliste */
.plist { display: grid; gap: 8px; }
.pitem { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; cursor: pointer; color: var(--ink); }
.pitem:hover { border-color: var(--accent); }
.pitem .t { font-weight: 600; min-width: 0; }
.pitem .s { grid-column: 1 / -1; color: var(--ink-soft); font-size: 0.86rem; }

/* Projektkopf und Schritte */
.phead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; }
.phead h1 { font-size: 1.35rem; }
.kpis { display: flex; flex-wrap: wrap; gap: 8px; }
.kpi { background: var(--surface-2); border-radius: 7px; padding: 6px 12px; min-width: 7.5rem; }
.kpi b { display: block; font: 600 1.15rem var(--font-mono); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 0.76rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; }
.steps { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.steps button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; cursor: pointer; font-size: 0.9rem; }
.steps button[aria-current="step"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.err { background: var(--err); } .dot.warn { background: var(--mark); }

/* Raster */
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.grid-scroll { overflow-x: auto; padding: 4px 0 8px; }
.pv-grid { display: inline-grid; gap: 3px; user-select: none; -webkit-user-select: none; touch-action: none; padding: 2px; }
.pv-grid .ax { font: 500 0.7rem var(--font-mono); color: var(--ink-soft); display: flex; align-items: center; justify-content: center; }
.cell { border: 1.5px dashed var(--cell-line); border-radius: 3px; background: var(--cell-empty); padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; font: 600 0.6rem var(--font-mono); color: #fff; }
.cell.modul { border: 1.5px solid rgba(0,0,0,0.45); background-color: var(--accent); background-image: linear-gradient(transparent 47%, rgba(255,255,255,0.28) 47%, rgba(255,255,255,0.28) 53%, transparent 53%); }
.cell.hindernis { border: 1.5px solid var(--ink-soft); color: var(--ink); background: repeating-linear-gradient(45deg, var(--obst), var(--obst) 4px, var(--obst-2) 4px, var(--obst-2) 8px); }
.cell.gesperrt { border: 1.5px solid var(--err); color: var(--err); background: repeating-linear-gradient(-45deg, var(--err-soft), var(--err-soft) 4px, var(--cell-empty) 4px, var(--cell-empty) 8px); }
.cell.sel { outline: 3px solid var(--mark); outline-offset: -2px; }
.cell span { padding: 0 2px; text-align: center; line-height: 1; word-break: break-word; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.82rem; color: var(--ink-soft); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; border: 1px solid rgba(0,0,0,0.25); }
.selbar { background: var(--warn-soft); border-radius: 7px; padding: 10px 12px; display: grid; gap: 8px; }
.orient { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; max-width: 360px; }
.swatch { width: 18px; height: 18px; border-radius: 4px; display: inline-block; border: 1px solid rgba(0,0,0,0.3); flex: 0 0 auto; }

.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); font-weight: 600; }
td input, td select { min-height: 36px; padding: 5px 7px; }

.item { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.issues { list-style: none; margin: 0; padding: 0; display: grid; }
.issues li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.issues li:last-child { border-bottom: 0; }
.issues li span.m { flex: 1; min-width: 0; }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; white-space: nowrap; }

.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.photo { border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); display: grid; }
.photo img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: var(--surface-2); max-width: 100%; }
.photo .m { padding: 6px; display: grid; gap: 5px; }
.photo .m input, .photo .m select { min-height: 34px; padding: 4px 6px; font-size: 0.85rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 2px solid transparent; cursor: pointer; }
.chips button.on { border-color: var(--accent); }

.sigpad { width: 100%; height: 170px; border: 2px dashed var(--line); border-radius: 7px; background: #fff; touch-action: none; display: block; }
.sigimg { height: 100px; max-width: 100%; object-fit: contain; background: #fff; border: 1px solid var(--line); border-radius: 7px; }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 16, 24, 0.55); z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); color: var(--ink); border-radius: 10px; padding: 18px; width: min(520px, 100%); display: grid; gap: 12px; max-height: 90vh; overflow: auto; }
.modal textarea { min-height: 200px; font: 0.8rem var(--font-mono); }

/* Bericht */
.report { --cell-empty: #fff; --cell-line: #aab7c5; --obst: #cfd5dc; --obst-2: #e3e7ec; --accent: #1f4fbf; --ink: #16212c; --ink-soft: #5b6b7a; --err: #b42318; --err-soft: #fbe1de; --surface-2: #eef3f8; --line: #d5dce4;
  background: #fff; color: #16212c; border: 1px solid var(--line); border-radius: 4px; padding: 28px 28px 36px; display: grid; gap: 10px; font-size: 0.86rem; max-width: 820px; width: 100%; margin: 0 auto; position: relative; overflow: hidden; }
.report h2 { color: #1f4fbf; font-size: 1.1rem; margin-top: 14px; }
.report h3 { margin-top: 6px; }
.report table { font-size: 0.8rem; } .report th, .report td { border-color: #d5dce4; color: #16212c; } .report th { color: #5b6b7a; }
.report .kv { display: grid; grid-template-columns: 36% 1fr; gap: 0; } .report .kv > div { padding: 4px 0; border-bottom: 1px solid #e1e6ec; }
.report .kv > div:nth-child(odd) { color: #5b6b7a; }
.report .rhead { display: flex; justify-content: space-between; font-size: 0.72rem; color: #5b6b7a; border-bottom: 1px solid #d5dce4; padding-bottom: 6px; }
.report .draft { position: absolute; top: 260px; left: 50%; transform: translateX(-50%) rotate(-28deg); font: 700 6rem var(--font-display); color: rgba(225, 29, 72, 0.1); pointer-events: none; white-space: nowrap; }
.report .rphotos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.report .rphotos img { width: 100%; aspect-ratio: 4/3; object-fit: contain; background: #f1f5f9; }
.report .cell { cursor: default; } .report .pv-grid { touch-action: auto; }
.report .alert { background: #fbe1de; color: #b42318; padding: 6px 10px; border-left: 3px solid #b42318; }
.report .kpis .kpi { background: #eef3f8; } .report .kpi span { color: #5b6b7a; }
@media print {
  .top, .noprint, body::before { display: none !important; }
  body { background: #fff; } .wrap { padding: 0; max-width: none; }
  .report { border: 0; padding: 0; max-width: none; }
  .report .pagebreak { break-before: page; }
}
@media (prefers-reduced-motion: no-preference) { .btn, .cell { transition: background-color 0.12s, border-color 0.12s; } }
</style>

<header class="top">
  <div class="top-in">

<script>
"use strict";
// ======================================================================

// Alle Daten liegen nur in diesem Browser (localStorage).
// ======================================================================

const KEY = "pvdoku-prototyp-v1";
const STATUS = { entwurf: "Entwurf", in_bearbeitung: "In Bearbeitung", zur_pruefung: "Zur Prüfung", nacharbeit: "Nacharbeit erforderlich", abgeschlossen: "Abgeschlossen", archiviert: "Archiviert" };
const TRANS = { entwurf: ["in_bearbeitung", "zur_pruefung"], in_bearbeitung: ["entwurf", "zur_pruefung"], zur_pruefung: ["in_bearbeitung", "nacharbeit", "abgeschlossen"], nacharbeit: ["in_bearbeitung", "zur_pruefung"], abgeschlossen: ["nacharbeit", "archiviert"], archiviert: ["abgeschlossen"] };
const ROLES = { admin: "Administrator", projektleiter: "Projektverantwortlicher", monteur: "Monteur", betrachter: "Betrachter" };
const ORIENT = { N: "Nord", NO: "Nordost", O: "Ost", SO: "Südost", S: "Süd", SW: "Südwest", W: "West", NW: "Nordwest" };
const ORIENT_ORDER = ["NW", "N", "NO", "W", "O", "SW", "S", "SO"];
const COMP = { wechselrichter: "Wechselrichter", speicher: "Speicher", datenlogger: "Datenlogger", smart_meter: "Smart Meter", wallbox: "Wallbox", sonstiges: "Sonstige Komponente" };
const COMP_PHOTO = { wechselrichter: "wechselrichter", speicher: "speicher", datenlogger: "sonstiges", smart_meter: "zaehlerschrank", wallbox: "sonstiges", sonstiges: "sonstiges" };

const COVERINGS = ["Tonziegel", "Betondachstein", "Schiefer", "Trapezblech", "Stehfalz", "Bitumen", "Folie", "Sonstige"];
const MOUNTINGS = ["Aufdach", "Indach", "Flachdach aufgeständert", "Flachdach Ost-West", "Fassade", "Sonstige"];

const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

const fmtKwp = (v) => fmtNum(v, 3) + " kWp";

function audit(p, action, detail = "") {
  const last = p.audit[p.audit.length - 1];

  if (last && last.action === action && last.detail === detail && last.user === S.user && Date.now() - new Date(last.at) < 120000) { last.at = now; return; }
  p.audit.push({ at: now, user: S.user, role: S.role, action, detail, version: p.version });
  if (p.audit.length > 800) p.audit.splice(0, p.audit.length - 800);

const countModules = (roof) => Object.values(roof.cells).filter((c) => c.s === "modul").length;
const moduleType = (p, roof) => p.moduleTypes.find((m) => m.id === roof.moduleTypeId);
const roofKwp = (p, roof) => { const m = moduleType(p, roof); return m && m.wp > 0 ? Math.round(countModules(roof) * m.wp) / 1000 : 0; };
const totals = (p) => ({ modules: p.roofs.reduce((a, r) => a + countModules(r), 0), kwp: p.roofs.reduce((a, r) => a + roofKwp(p, r), 0) });

const blank = (v) => !v || String(v).trim() === "";

function displayDims(rows, cols, rot) { return rot === 90 || rot === 270 ? [cols, rows] : [rows, cols]; }
function d2l(i, j, rows, cols, rot) {
  if (rot === 90) return [rows - 1 - j, i];
  if (rot === 180) return [rows - 1 - i, cols - 1 - j];
  if (rot === 270) return [j, cols - 1 - i];
  return [i, j];
}

// Vollständigkeitsprüfung – gleiche Regeln wie in der App (Fehler blockieren den Abschluss)
function checkCompleteness(p) {
  const out = [];
  const E = (step, m) => out.push({ level: "error", step, m });
  const W = (step, m) => out.push({ level: "warning", step, m });
  if (blank(p.number)) E("stammdaten", "Projektnummer fehlt");
  if (blank(p.name)) E("stammdaten", "Projektname fehlt");
  if (!p.installation_date) E("stammdaten", "Installationsdatum fehlt");
  if (blank(p.contractor)) E("stammdaten", "Ausführendes Unternehmen fehlt");
  if (blank(p.installer)) E("stammdaten", "Verantwortlicher Monteur fehlt");
  const c = p.client;
  if ((c.type === "person" && blank(c.last)) || (c.type === "firma" && blank(c.company))) E("bauherr", "Name bzw. Firma des Bauherrn fehlt");
  if (blank(c.street) || blank(c.zip) || blank(c.city)) E("bauherr", "Anschrift des Bauherrn unvollständig");
  if (blank(c.phone) && blank(c.email)) W("bauherr", "Keine Kontaktmöglichkeit (Telefon/E-Mail) zum Bauherrn");
  if (p.site.differs && (blank(p.site.street) || blank(p.site.zip) || blank(p.site.city))) E("bauherr", "Abweichende Anlagenanschrift unvollständig");
  if (p.roofs.length === 0) E("dachflaechen", "Keine Dachfläche angelegt");
  for (const r of p.roofs) {
    const n = countModules(r); const m = moduleType(p, r);
    if (!r.orientation) E("dachflaechen", `Dachfläche „${r.name}“: Himmelsrichtung fehlt`);
    if (n === 0) E("dachflaechen", `Dachfläche „${r.name}“: keine Module belegt`);
    if (n > 0 && (!m || !(m.wp > 0))) E("dachflaechen", `Dachfläche „${r.name}“: Modultyp mit Nennleistung fehlt`);
    else if (n > 0 && m && (blank(m.manufacturer) || blank(m.model))) E("dachflaechen", `Dachfläche „${r.name}“: Hersteller/Typ des Moduls fehlt`);
    if (r.tilt == null) W("dachflaechen", `Dachfläche „${r.name}“: Dachneigung fehlt`);
  }
  if (p.strings.length) {
    const un = p.roofs.reduce((a, r) => a + Object.values(r.cells).filter((x) => x.s === "modul" && !p.strings.some((s) => s.id === x.str)).length, 0);
    if (un) W("dachflaechen", `${un} Modul(e) ohne String-Zuordnung`);
    for (const s of p.strings) if (!s.inverterId) W("dachflaechen", `String „${s.name}“ ohne Wechselrichter`);
  }
  if (!p.components.some((x) => x.category === "wechselrichter")) E("komponenten", "Kein Wechselrichter erfasst");
  for (const k of p.components) {
    const lbl = COMP[k.category] + (k.model ? ` „${k.model}“` : "");
    if (blank(k.manufacturer) || blank(k.model)) E("komponenten", `${lbl}: Hersteller oder Modell fehlt`);
    if (blank(k.serial)) W("komponenten", `${lbl}: Seriennummer fehlt`);
    if (!p.photos.some((f) => f.componentId === k.id)) W("komponenten", `${lbl}: kein Foto hinterlegt`);
  }
  for (const cat of S.company.requiredPhotos) if (!p.photos.some((f) => f.category === cat)) E("fotos", `Pflichtfoto fehlt: ${PHOTO[cat]}`);
  for (const t of p.tests) {
    if (t.required && !t.status) E("pruefung", `Pflichtprüfung nicht bearbeitet: ${t.label}`);
    else if (t.required && t.status === "geprueft" && t.unit && blank(t.value)) E("pruefung", `Messwert fehlt: ${t.label}`);
    else if (t.status === "nicht_geprueft") W("pruefung", `Nicht geprüft: ${t.label}`);
  }
  for (const x of p.checklist) {
    if (x.required && !x.status) E("pruefung", `Checkliste nicht bearbeitet: ${x.text}`);
    else if (x.required && x.status === "nicht_erledigt" && blank(x.comment)) E("pruefung", `Abweichung ohne Begründung: ${x.text}`);
    else if (x.status === "nicht_erledigt") W("pruefung", `Begründete Abweichung: ${x.text}`);
  }
  for (const d of p.defects) {
    if (d.status === "erledigt") continue;
    if (d.priority === "hoch") E("maengel", `Offener Mangel (hoch): ${d.description}`); else W("maengel", `Offener Mangel: ${d.description}`);
  }
  for (const role of ["dokumentierender", "bauherr"]) if (!p.signatures.some((s) => s.role === role && s.version === p.version)) W("abschluss", `Unterschrift ${role === "bauherr" ? "Bauherr/Empfänger" : "Dokumentierender"} fehlt`);
  return out;
}

// ---------------------------------------------------------------- Modal (statt alert/confirm/prompt)
function modal({ title, body = "", input = null, ok = "OK", cancel = "Abbrechen", danger = false, wide = false }) {
  return new Promise((resolve) => {
    const m = $("#modal");
    m.hidden = false;
    m.innerHTML = `<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" ${wide ? 'style="width:min(760px,100%)"' : ""}>
      <h2 id="mt">${esc(title)}</h2>${body}
      ${input ? `<input id="modal-in" value="${esc(input.value || "")}" placeholder="${esc(input.placeholder || "")}">` : ""}
      <div class="row" style="justify-content:flex-end">${cancel ? `<button class="btn" id="modal-no">${esc(cancel)}</button>` : ""}<button class="btn ${danger ? "danger" : "pri"}" id="modal-ok">${esc(ok)}</button></div></div></div>`;
    const done = (v) => { m.hidden = true; m.innerHTML = ""; resolve(v); };
    const inp = $("#modal-in");
    $("#modal-ok").onclick = () => done(input ? inp.value : true);
    if ($("#modal-no")) $("#modal-no").onclick = () => done(null);
    m.querySelector(".modal-bg").addEventListener("click", (e) => { if (e.target.classList.contains("modal-bg")) done(null); });
    m.onkeydown = (e) => { if (e.key === "Escape") done(null); if (e.key === "Enter" && input) done(inp.value); };
    (inp || $("#modal-ok")).focus();
  });
}
function note(text, kind = "info") { return modal({ title: kind === "err" ? "Hinweis" : "Info", body: `<div class="note ${kind}">${esc(text)}</div>`, cancel: null }); }

function gridHtml(p, r, { interactive, small = false }) {
  const rot = r.rotation; const [dr, dc] = displayDims(r.rows, r.cols, rot);
  const swapped = rot === 90 || rot === 270; const land = (r.format === "quer") !== swapped;
  const k = small ? Math.min(1, 560 / (dc * (land ? 40 : 28))) : 1;
  const w = Math.round((land ? 44 : 30) * k), h = Math.round((land ? 30 : 44) * k);
  const smap = new Map(p.strings.map((s) => [s.id, s]));
  let html = `<div class="grid-scroll"><div class="pv-grid" ${interactive ? `data-grid="${r.id}"` : ""} style="grid-template-columns:22px repeat(${dc},${w}px);grid-auto-rows:${h}px" role="grid" aria-label="Modulraster ${esc(r.name)}">
    <div style="height:16px"></div>`;
  for (let j = 0; j < dc; j++) { const [lr, lc] = d2l(0, j, r.rows, r.cols, rot); html += `<div class="ax" style="height:16px;align-self:end">${swapped ? rowLabel(lr) : lc + 1}</div>`; }
  for (let i = 0; i < dr; i++) {
    const [lr0, lc0] = d2l(i, 0, r.rows, r.cols, rot);
    html += `<div class="ax">${swapped ? lc0 + 1 : rowLabel(lr0)}</div>`;
    for (let j = 0; j < dc; j++) {
      const [lr, lc] = d2l(i, j, r.rows, r.cols, rot); const key = lr + ":" + lc; const c = r.cells[key];
      const s = c?.str ? smap.get(c.str) : null;
      const title = [posLabel(lr, lc), c ? ({ modul: "Modul", hindernis: "Hindernis", gesperrt: "gesperrt" })[c.s] : "frei", s ? "String " + s.name : "", c?.l, c?.sn ? "SN " + c.sn : ""].filter(Boolean).join(" · ");
      const label = c?.s === "modul" ? (s ? s.name : "") : c ? (c.l || (c.s === "gesperrt" ? "✕" : "")) : "";
      html += `<${interactive ? "button" : "div"} ${interactive ? `type="button" data-di="${i}" data-dj="${j}"` : ""} role="gridcell" class="cell ${c?.s || ""} ${interactive && ui.sel.has(key) ? "sel" : ""}" style="${s ? `background-color:${s.color}` : ""}" title="${esc(title)}" aria-label="${esc(title)}">${label ? `<span>${esc(label.slice(0, 8))}</span>` : ""}</${interactive ? "button" : "div"}>`;
    }
  }
  return html + "</div></div>";
}

// ---------------------------------------------------------------- Unterschriften-Zeichenfeld
const pads = {};
function initPads() {
  for (const cv of document.querySelectorAll("canvas.sigpad")) {
    const role = cv.id.replace("pad-", ""); const ratio = Math.min(devicePixelRatio || 1, 2);
    cv.width = cv.clientWidth * ratio; cv.height = cv.clientHeight * ratio;
    const ctx = cv.getContext("2d"); ctx.scale(ratio, ratio); ctx.lineWidth = 2.2; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0b1f3a";
    pads[role] = { cv, empty: true }; let drawing = false;
    const pos = (e) => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    cv.onpointerdown = (e) => { drawing = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 0.1, y + 0.1); ctx.stroke(); pads[role].empty = false; };
    cv.onpointermove = (e) => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); };
    cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
  }
}
function afterRender() { initPads(); }

// ---------------------------------------------------------------- Raster-Interaktion
const drag = { active: false };
function gridAction(p, r, key) {
  const c = r.cells[key];
  switch (ui.tool) {
    case "modul": if (c && c.s !== "modul") return null; return c ? "leeren" : "modul";
    case "hindernis": return c?.s === "hindernis" ? "leeren" : "hindernis";
    case "gesperrt": return c?.s === "gesperrt" ? "leeren" : "gesperrt";
    case "leeren": return "leeren";
    case "string": if (c?.s !== "modul") return null; return c.str === ui.activeString ? "unstring" : "string";
  }
  return null;
}
function applyCell(r, key, act, startState) {
  const c = r.cells[key];
  if (ui.tool === "modul" && c && c.s !== "modul") return;
  if ((ui.tool === "hindernis" || ui.tool === "gesperrt") && act === "leeren" && c?.s !== startState) return;
  if (act === "modul") { if (c?.s !== "modul") r.cells[key] = { s: "modul", l: "", str: null, sn: "" }; }
  else if (act === "hindernis" || act === "gesperrt") r.cells[key] = { s: act, l: c && c.s !== "modul" ? c.l : "", str: null, sn: "" };
  else if (act === "leeren") delete r.cells[key];
  else if (act === "string" && c?.s === "modul") c.str = ui.activeString;
  else if (act === "unstring" && c?.s === "modul") c.str = null;
}
function cellAt(x, y) { const el = document.elementFromPoint(x, y)?.closest("[data-di]"); return el ? [Number(el.dataset.di), Number(el.dataset.dj)] : null; }

document.addEventListener("pointerdown", (e) => {

  if (ui.tool === "auswahl") { ui.sel = new Set([key]); markSel(); return; }
  const act = gridAction(p, r, key); drag.act = act; drag.startState = r.cells[key]?.s;

document.addEventListener("pointermove", (e) => {

}

document.addEventListener("input", onInput);
document.addEventListener("change", onInput);
function onInput(e) {
  const el = e.target;
  if (el.dataset.ui) return onUiInput(el, e);
  if (el.dataset.co) { if (el.dataset.co === "user") S.user = el.value; else S.company[el.dataset.co] = el.value; save(); return; }
  if (el.dataset.reqphoto && e.type === "change") { const k = el.dataset.reqphoto; S.company.requiredPhotos = el.checked ? [...S.company.requiredPhotos, k] : S.company.requiredPhotos.filter((x) => x !== k); save(); return; }
  if (el.dataset.tpl) { const x = S.company.templates[el.dataset.tpl][+el.dataset.i]; x[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value; save(); return; }
  if (el.dataset.upload && e.type === "change") return upload(el);
  if (!el.dataset.f) return;
  // Textfelder werden bei "input" übernommen; das nachfolgende "change" (beim Verlassen) würde sonst
  // die Kopfzeile neu zeichnen und einen gleichzeitigen Klick auf einen Schritt verschlucken.
  const textLike = el.tagName === "TEXTAREA" || (el.tagName === "INPUT" && !["checkbox", "radio", "color"].includes(el.type));
  if (e.type === "change" && textLike && !el.dataset.rr) return;
  if (el.dataset.rr && e.type === "input" && el.type !== "radio" && el.type !== "checkbox" && el.tagName !== "SELECT") return; // erst bei "change"
  const p = cur(); if (!p || !editable(p)) return;
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.t === "num") v = v === "" ? null : Number(String(v).replace(",", "."));
  if (el.dataset.t === "int") v = Math.round(Number(v));
  const target = el.dataset.coll ? p[el.dataset.coll].find((x) => x.id === el.dataset.id) : p;
  if (!target) return;
  if (el.dataset.coll === "roofs" && (el.dataset.f === "rows" || el.dataset.f === "cols")) return resizeRoof(p, target, el.dataset.f, v, el);
  setPath(target, el.dataset.f, v);
  el.classList.toggle("miss", el.closest(".field")?.querySelector(".req") != null && blank(v));
  const label = el.closest("label")?.querySelector("span")?.textContent?.replace("*", "").trim() || el.getAttribute("placeholder") || el.dataset.f;
  const where = el.dataset.coll ? ({ roofs: "Dachfläche", components: "Komponente", moduleTypes: "Modultyp", strings: "String", photos: "Foto", tests: "Prüfwert", checklist: "Checkliste", defects: "Mangel" })[el.dataset.coll] : "Projekt";
  audit(p, `${where} geändert`, label);
  save();
  if (el.dataset.rr && e.type === "change") rerenderBody(); else refreshHead();
}
async function resizeRoof(p, r, f, v, el) {
  const max = f === "rows" ? 40 : 60; if (!(v >= 1)) return; v = Math.min(v, max);
  const rows = f === "rows" ? v : r.rows, cols = f === "cols" ? v : r.cols;
  const lost = Object.keys(r.cells).filter((k) => { const [a, b] = k.split(":").map(Number); return a >= rows || b >= cols; });
  if (lost.length && !(await modal({ title: "Raster verkleinern?", body: `<p>Dabei werden ${lost.length} belegte oder markierte Positionen entfernt.</p>`, ok: "Verkleinern", danger: true }))) { el.value = r[f]; return; }
  for (const k of lost) delete r.cells[k];
  r[f] = v; ui.sel = new Set(); audit(p, "Dachfläche geändert", `${r.name}: Raster ${r.rows} × ${r.cols}`); save(); rerenderBody();
}
function onUiInput(el, e) {
  const k = el.dataset.ui;
  if (k === "q") { ui.q = el.value; const pos = el.selectionStart; $("#main").innerHTML = renderList(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); return; }

  const p = cur(); const r = p?.roofs.find((x) => x.id === ui.roofId);

}

async function compress(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const sc = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL("image/jpeg", 0.72);
  } finally { URL.revokeObjectURL(url); }
}
async function upload(el) {
  const p = cur(); if (!p || !editable(p)) return; const meta = JSON.parse(el.dataset.upload); const files = [...el.files]; const fails = [];
  setSave("", `Fotos werden verarbeitet (0/${files.length}) …`);
  for (let i = 0; i < files.length; i++) {
    try {
      const data = await compress(files[i]);
      p.photos.push({ id: uid(), category: meta.category, data, caption: "", date: files[i].lastModified ? new Date(files[i].lastModified).toISOString().slice(0, 10) : today(), componentId: meta.componentId || null, defectId: meta.defectId || null });
      setSave("", `Fotos werden verarbeitet (${i + 1}/${files.length}) …`);
    } catch (err) { fails.push(files[i].name); }
  }
  audit(p, "Fotos hinzugefügt", `${files.length - fails.length} × ${PHOTO[meta.category]}`);
  saveNow(); rerenderBody();
  if (fails.length) note(`Diese Dateien konnten nicht gelesen werden: ${fails.join(", ")}. Bitte als JPEG oder PNG auswählen.`, "err");
}

    try {
      const d = JSON.parse(txt.value); if (d.format !== "pv-doku-prototyp" || !d.project?.number) throw new Error();
      const p = d.project; p.id = uid(); p.status = "entwurf"; p.versions = []; p.signatures = [];
      let n = p.number, i = 1; while (S.projects.some((x) => x.number === n)) n = `${p.number}-import${i++ > 1 ? "-" + i : ""}`; p.number = n;
      p.audit = [...(p.audit || []), { at: new Date().toISOString(), user: S.user, role: S.role, action: "Importiert", detail: "aus Export vom " + fmtDT(d.exported_at), version: p.version }];
      S.projects.push(p); saveNow(); ui.page = "project"; ui.pid = p.id; ui.step = "stammdaten"; render();
    } catch { note("Der Text ist kein gültiger Export dieses Prototyps.", "err"); }
  },
  tplAdd(el) { S.company.templates[el.dataset.k].push({ text: "Neuer Punkt", unit: "", required: false }); save(); render(); },
  tplDel(el) { S.company.templates[el.dataset.k].splice(+el.dataset.i, 1); save(); render(); },
  async resetAll() { if (!(await modal({ title: "Alles zurücksetzen?", body: "<p>Alle Projekte und Einstellungen in diesem Browser werden gelöscht und das Beispielprojekt neu geladen.</p>", ok: "Zurücksetzen", danger: true }))) return; S = seed(); ui.page = "list"; saveNow(); render(); },
};

document.addEventListener("click", async (e) => {
  if (e.target.id === "copyexp") { const t = $("#exp"); try { await navigator.clipboard.writeText(t.value); $("#copymsg").textContent = "Kopiert."; } catch { t.focus(); t.select(); $("#copymsg").textContent = "Text ist markiert – bitte mit Strg+C bzw. „Kopieren“ übernehmen."; } return; }
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  // Tastaturbedienung des Rasters (Klick ohne Zeiger)
  const fn = A[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener("keydown", (e) => {
  const el = e.target.closest?.("[data-di]"); if (!el || (e.key !== "Enter" && e.key !== " ")) return;
  e.preventDefault(); const p = cur(); const r = p.roofs.find((x) => x.id === ui.roofId); if (!editable(p)) return;
  const [lr, lc] = d2l(+el.dataset.di, +el.dataset.dj, r.rows, r.cols, r.rotation); const key = lr + ":" + lc;
  if (ui.tool === "auswahl") { ui.sel.has(key) ? ui.sel.delete(key) : ui.sel.add(key); redrawGrid(); }
  else { const act = gridAction(p, r, key); if (act) { applyCell(r, key, act, r.cells[key]?.s); gridChanged(p, r); } }
  const again = document.querySelector(`.pv-grid [data-di="${el.dataset.di}"][data-dj="${el.dataset.dj}"]`); if (again) again.focus();
});
$("#role").addEventListener("change", (e) => { S.role = e.target.value; if (S.role !== "admin" && ui.page === "admin") ui.page = "list"; save(); render(); });

// ---------------------------------------------------------------- Start
S = load();
if (S.view) { ui.page = S.view.page === "report" ? "project" : S.view.page; ui.pid = S.view.pid; ui.step = S.view.step || "stammdaten"; }
render();
setSave("", "lokal gespeichert");
</script>
